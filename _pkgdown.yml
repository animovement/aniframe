url: http://animovement.dev/aniframe/
home:
  title: "aniframe – An R package providing core data structures for movement data"

authors:
  - name: "Mikkel Roald‑Arbøl"
    href: "https://roald-arboel.com"

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - news
    right:
      - search
      - github
      - zulip
      - lightswitch
  components:
    zulip:
      icon: fa-comments
      href: https://animovement.zulipchat.com
      aria-label: Chat on Zulip

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - articles/aniframe-structure
      - articles/aniframe-metadata
      - articles/aniframe-connections
      - articles/anievent-structure

reference:
  - title: "Creating and converting aniframe objects"
    desc: >
      Functions that create an aniframe, coerce other objects to aniframe,
      or provide example data.
    contents:
      - as_aniframe
      - aniframe
      - example_aniframe
      - is_aniframe
      - ensure_is_aniframe

  - title: "Creating and converting anievent objects"
    desc: >
      Functions that create an anievent (long-format behavioural event
      records) or coerce other objects to anievent.
    contents:
      - as_anievent
      - anievent
      - is_anievent
      - ensure_is_anievent
      - validate_anievent

  - title: "Metadata handling"
    desc: >
      Functions for reading, setting, and retrieving the metadata
      attached to aniframe or anievent objects.
    contents:
      - get_metadata
      - set_metadata
      - set_unit_time
      - set_unit_space
      - set_unit_angle
      - set_sampling_rate
      - set_origin
      - set_y_height
      - default_metadata

  - title: "Connections"
    desc: >
      Manage connections between identity or temporal variables (e.g.
      skeleton edges between keypoints, or social-network edges between
      individuals). Stored as a named list of `from`/`to` tibbles in
      `metadata$connections`.
    contents:
      - set_connections
      - get_connections
      - add_connections
      - remove_connections

  - title: "Spatial checks"
    desc: |
      These functions provide checks for your coordinate system.
    contents:
    - is_cartesian
    - is_cartesian_1d
    - is_cartesian_2d
    - is_cartesian_3d
    - is_polar
    - is_cylindrical
    - is_spherical
    - ensure_is_cartesian
    - ensure_is_cartesian_1d
    - ensure_is_cartesian_2d
    - ensure_is_cartesian_3d
    - ensure_is_polar
    - ensure_is_cylindrical
    - ensure_is_spherical

  - title: "Helpers"
    desc:
    contents:
    - rad_to_deg
    - deg_to_rad
    - convert_nan_to_na

  - title: "Data manipulation (dplyr‑style verbs) – aniframe"
    desc: >
      S3 methods that mirror dplyr verbs for aniframe objects.
    contents:
      - arrange.aniframe
      - filter.aniframe
      - group_by.aniframe
      - mutate.aniframe
      - relocate.aniframe
      - rename.aniframe
      - select.aniframe
      - slice.aniframe
      - tbl_sum.aniframe
      - ungroup.aniframe

  - title: "Conversion helpers – aniframe"
    desc: |
      Methods that let you treat aniframe objects like regular data frames.
    contents:
      - as.data.frame.aniframe
      - "[.aniframe"
      - "[[.aniframe"
      - "[[<-.aniframe"
      - "[<-.aniframe"
      - "$<-.aniframe"
      - "$.aniframe"
      - names<-.aniframe

  - title: "Data manipulation (dplyr‑style verbs) – anievent"
    desc: >
      S3 methods that mirror dplyr verbs for anievent objects.
    contents:
      - arrange.anievent
      - filter.anievent
      - group_by.anievent
      - mutate.anievent
      - relocate.anievent
      - rename.anievent
      - select.anievent
      - slice.anievent
      - tbl_sum.anievent
      - ungroup.anievent

  - title: "Conversion helpers – anievent"
    desc: |
      Methods that let you treat anievent objects like regular data frames.
    contents:
      - as.data.frame.anievent
      - "[.anievent"
      - "[[.anievent"
      - "[[<-.anievent"
      - "[<-.anievent"
      - "$<-.anievent"
      - "$.anievent"
      - names<-.anievent
