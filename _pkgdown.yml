url: https://animovement.dev/aniframe/
home:
  title: "aniframe – An R package providing core data structures for movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - articles/aniframe-structure
      - articles/aniframe-metadata
      - articles/aniframe-connections
      - articles/anievent-structure

reference:
  - title: "Creating and converting aniframe objects"
    desc: >
      Functions that create an aniframe, coerce other objects to aniframe,
      or provide example data.
    contents:
      - as_aniframe
      - aniframe
      - example_aniframe
      - is_aniframe
      - ensure_is_aniframe
      - validate_aniframe

  - title: "Creating and converting anievent objects"
    desc: >
      Functions that create an anievent (long-format behavioural event
      records) or coerce other objects to anievent.
    contents:
      - to_anievent
      - as_anievent
      - anievent
      - is_anievent
      - ensure_is_anievent
      - validate_anievent

  - title: "Metadata handling"
    desc: >
      Functions for reading, setting, and retrieving the metadata
      attached to aniframe or anievent objects.
    contents:
      - get_metadata
      - set_metadata
      - set_unit_time
      - set_unit_space
      - set_unit_angle
      - set_sampling_rate
      - set_origin
      - set_y_height
      - default_metadata

  - title: "Declaring variables"
    desc: >
      Declare which columns carry identity, time and position. These are
      the frame's structure rather than a description of it, so the
      setters restructure the frame to match — coercing column types,
      relocating, reordering, regrouping, and refreshing derived fields.
      `set_metadata()` refuses these fields for that reason.
    contents:
      - variables
      - variables_event
      - get_index
      - set_index
      - get_axes
      - set_axes

  - title: "Connections"
    desc: >
      Manage connections between identity or temporal variables (e.g.
      skeleton edges between keypoints, or social-network edges between
      individuals). Stored as a named list of `from`/`to` tibbles in
      `metadata$connections`.
    contents:
      - set_connections
      - get_connections
      - add_connections
      - remove_connections

  - title: "Spatial checks"
    desc: |
      These functions provide checks for your coordinate system.
      `is_spatial()` and `ensure_is_spatial()` check the spatial columns
      against the `variables_where` metadata; the `is_cartesian*()` family
      checks for particular column names.
    contents:
    - is_spatial
    - ensure_is_spatial
    - is_cartesian
    - is_cartesian_1d
    - is_cartesian_2d
    - is_cartesian_3d
    - is_polar
    - is_cylindrical
    - is_spherical
    - ensure_is_cartesian
    - ensure_is_cartesian_1d
    - ensure_is_cartesian_2d
    - ensure_is_cartesian_3d
    - ensure_is_polar
    - ensure_is_cylindrical
    - ensure_is_spherical

  - title: "Helpers"
    desc:
    contents:
    - rad_to_deg
    - deg_to_rad
    - convert_nan_to_na

